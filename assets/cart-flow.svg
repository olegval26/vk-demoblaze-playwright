<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">DemoBlaze cart flow</title>
  <desc id="desc">A visual map of the Go and Playwright test from product page to a verified one-item cart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#1a2140"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#76e4d2"/><stop offset="1" stop-color="#8ea3ff"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c0caff" opacity=".16"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#bg)"/><rect width="1200" height="380" rx="26" fill="url(#dots)"/>
  <circle cx="104" cy="41" r="180" fill="#38dfc5" opacity=".06"/>
  <text x="70" y="78" fill="#89e5d4" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">GO  /  PLAYWRIGHT  /  END-TO-END</text>
  <text x="70" y="151" fill="#f3f6ff" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="750">The cart flow</text>
  <text x="72" y="190" fill="#b5c0d8" font-family="Inter,Arial,sans-serif" font-size="19">One small journey, checked from product page to cart.</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700">
    <rect x="70" y="224" width="116" height="34" rx="17" fill="#13273a" stroke="#397d79"/><text x="128" y="246" text-anchor="middle" fill="#a9f5e3">OPEN</text>
    <path d="M192 241h30" stroke="url(#accent)" stroke-width="2"/><path d="m217 236 7 5-7 5" fill="none" stroke="#8ea3ff" stroke-width="2"/>
    <rect x="232" y="224" width="116" height="34" rx="17" fill="#13273a" stroke="#397d79"/><text x="290" y="246" text-anchor="middle" fill="#a9f5e3">ADD ITEM</text>
    <path d="M354 241h30" stroke="url(#accent)" stroke-width="2"/><path d="m379 236 7 5-7 5" fill="none" stroke="#8ea3ff" stroke-width="2"/>
    <rect x="394" y="224" width="116" height="34" rx="17" fill="#13273a" stroke="#397d79"/><text x="452" y="246" text-anchor="middle" fill="#a9f5e3">ACCEPT</text>
    <path d="M516 241h30" stroke="url(#accent)" stroke-width="2"/><path d="m541 236 7 5-7 5" fill="none" stroke="#8ea3ff" stroke-width="2"/>
    <rect x="554" y="224" width="116" height="34" rx="17" fill="#17332e" stroke="#44b994"/><text x="612" y="246" text-anchor="middle" fill="#8ff0c4">VERIFY</text>
  </g>
  <rect x="742" y="48" width="398" height="282" rx="20" fill="#f5f7fc"/>
  <path d="M762 48h358a20 20 0 0 1 20 20v25H742V68a20 20 0 0 1 20-20Z" fill="#202943"/>
  <circle cx="766" cy="70" r="5" fill="#fc7378"/><circle cx="784" cy="70" r="5" fill="#ffc85b"/><circle cx="802" cy="70" r="5" fill="#4dd6b2"/>
  <rect x="828" y="60" width="270" height="20" rx="10" fill="#11192c"/><text x="844" y="74" fill="#9aa9c5" font-family="ui-monospace,Menlo,monospace" font-size="10">demoblaze.com/cart.html</text>
  <text x="770" y="119" fill="#26324b" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">CART  /  ASSERTION</text>
  <rect x="770" y="137" width="342" height="94" rx="13" fill="#fff" stroke="#e1e7f0"/>
  <rect x="789" y="153" width="52" height="62" rx="7" fill="#eaf0f7"/>
  <rect x="805" y="160" width="20" height="43" rx="5" fill="#182239"/><rect x="808" y="165" width="14" height="30" rx="3" fill="#6d8cff"/>
  <text x="858" y="173" fill="#24304a" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Samsung galaxy s6</text>
  <text x="858" y="198" fill="#76839a" font-family="Inter,Arial,sans-serif" font-size="13">exactly one cart row</text>
  <rect x="1051" y="157" width="40" height="28" rx="14" fill="#e5f8f1"/><text x="1071" y="176" text-anchor="middle" fill="#18875f" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700">1×</text>
  <rect x="770" y="251" width="342" height="49" rx="12" fill="#e7f8f1"/>
  <circle cx="794" cy="275" r="10" fill="#29a87c"/><path d="m789 275 4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="814" y="280" fill="#216b56" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">one item · expected product</text>
</svg>